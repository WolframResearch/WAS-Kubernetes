apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: resource-manager-hpa
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/component: resource-manager
    {{- include "was.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: resource-manager-deployment
  minReplicas: {{ .Values.resourceManager.replicaCount }}
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 85
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 90
