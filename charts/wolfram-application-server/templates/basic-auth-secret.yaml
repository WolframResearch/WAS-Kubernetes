apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.basicAuth.secretName }}
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/component: auth
    {{- include "was.labels" . | nindent 4 }}
type: Opaque
data:
  # The "auth" key must contain an htpasswd-formatted file (base64-encoded).
  # The default value is the checked-in hash for user "applicationserver".
  # Override basicAuth.credentials with: htpasswd -nb <user> <password>
  auth: {{ .Values.basicAuth.credentials | b64enc }}
