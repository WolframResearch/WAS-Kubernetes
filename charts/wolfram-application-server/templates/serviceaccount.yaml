{{/* ── Resource Manager ServiceAccount ──────────────────────────────────────── */}}
{{- if .Values.resourceManager.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "was.resourceManagerSAName" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/component: resource-manager
    {{- include "was.labels" . | nindent 4 }}
  {{- with (include "was.resourceManagerSAAnnotations" . | trim) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
---
{{/* ── awesrestartpods ServiceAccount + Role + RoleBinding ─────────────────── */}}
{{/*
  Used by endpoint-manager to call the Kubernetes API and rollout-restart the
  active-web-elements-server-deployment when a kernel restart is requested.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: awesrestartpods
  namespace: {{ .Values.namespace.name }}
  labels:
    k8s-app: was-awes
    app.kubernetes.io/component: endpoint-manager
    {{- include "was.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: awesrestartpods
  namespace: {{ .Values.namespace.name }}
  labels:
    k8s-app: was-awes
    app.kubernetes.io/component: endpoint-manager
    {{- include "was.labels" . | nindent 4 }}
rules:
- apiGroups: ["apps"]
  resources:
  - deployments
  verbs:
  - patch
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: awesrestartpods
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/component: endpoint-manager
    {{- include "was.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: awesrestartpods
  namespace: {{ .Values.namespace.name }}
roleRef:
  kind: Role
  name: awesrestartpods
  apiGroup: rbac.authorization.k8s.io
{{/* ── Object-storage credentials Secret (static mode only) ─────────────── */}}
{{- if eq .Values.objectStorage.auth.mode "static" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "was.objectStorageSecretName" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/component: resource-manager
    {{- include "was.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if eq .Values.cloud "aws" }}
  accessKey: {{ .Values.objectStorage.auth.accessKey | quote }}
  {{- end }}
  secretKey: {{ .Values.objectStorage.auth.secretKey | quote }}
{{- end }}
